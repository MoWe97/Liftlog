app = "liftlog"
primary_region = "ams"

[build]

[build.args]
  # Set at deploy time: fly deploy --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_live_...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
